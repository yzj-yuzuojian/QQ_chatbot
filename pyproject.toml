[project]
name = "qq-companion"
version = "1.0.0"
description = "带长期记忆人格的 QQ 陪伴机器人，客户自备 API key"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9,<4",
    "websockets>=12",
    "cryptography>=42",
    "numpy>=1.26",
]

[project.scripts]
companion = "companion.cli:main"

[project.urls]
Homepage = "https://github.com/yzj-yuzuojian/QQ_chatbot"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["companion*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
